services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-expense-tracker
    restart: always
    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: quarkus
      POSTGRES_PASSWORD: quarkus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: